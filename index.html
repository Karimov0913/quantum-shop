<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM SHOP - Футуристический магазин</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.1s ease;
            transform: translate(-50%, -50%);
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .search-bar {
            position: relative;
        }

        .search-bar input {
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: rgba(0, 255, 255, 0.05);
            color: #fff;
            width: 300px;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .cart-btn {
            position: relative;
            padding: 10px 20px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .cart-btn:hover {
            transform: scale(1.05);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff00ff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .hero {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-top: 80px;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero-content {
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .filters {
            padding: 40px 50px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0, 255, 255, 0.02);
        }

        .filter-btn {
            padding: 10px 25px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .products {
            padding: 50px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .product-card {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), rgba(255, 0, 255, 0.05));
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
            overflow: hidden;
        }

        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 15px;
            background: linear-gradient(45deg, #ff00ff, #ffff00);
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .product-info {
            padding: 20px;
        }

        .product-category {
            color: #00ffff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #fff;
        }

        .product-description {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .product-price {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .add-to-cart {
            padding: 10px 20px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .add-to-cart:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.4);
        }

        .cart-sidebar {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100vh;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 255, 255, 0.3);
            z-index: 2000;
            transition: right 0.4s;
            overflow-y: auto;
            padding: 100px 30px 30px 30px;
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-close {
            position: absolute;
            top: 30px;
            right: 30px;
            background: none;
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .cart-close:hover {
            transform: rotate(90deg);
            color: #ff00ff;
        }

        .cart-title {
            font-size: 28px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #00ffff;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quantity-btn:hover {
            background: rgba(0, 255, 255, 0.4);
        }

        .remove-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: #ff00ff;
            cursor: pointer;
            font-size: 18px;
        }

        .cart-total {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .total-row.grand {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.4);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffff;
            border-radius: 50%;
            animation: particle-float 10s infinite;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px);
                opacity: 0;
            }
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
            color: #aaa;
        }

        .notification {
            position: fixed;
            top: 100px;
            right: -400px;
            padding: 20px 30px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border-radius: 15px;
            color: #fff;
            z-index: 3000;
            transition: right 0.4s;
            font-weight: bold;
        }

        .notification.show {
            right: 30px;
        }
    </style>
</head>
<body>
    <div class="cursor"></div>

    <header>
        <div class="logo">QUANTUM SHOP</div>
        <div class="header-controls">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Поиск товаров...">
            </div>
            <button class="cart-btn" onclick="toggleCart()">
                🛒 Корзина
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>ДОБРО ПОЖАЛОВАТЬ</h1>
            <p style="color: #aaa; font-size: 20px;">Откройте для себя технологии будущего</p>
        </div>
    </section>

    <div class="filters">
        <button class="filter-btn active" data-category="all">Все товары</button>
        <button class="filter-btn" data-category="гаджеты">Гаджеты</button>
        <button class="filter-btn" data-category="аудио">Аудио</button>
        <button class="filter-btn" data-category="компьютеры">Компьютеры</button>
        <button class="filter-btn" data-category="аксессуары">Аксессуары</button>
        <button class="filter-btn" data-category="vr">VR/AR</button>
    </div>

    <div class="products" id="productsContainer"></div>

    <div class="cart-sidebar" id="cartSidebar">
        <button class="cart-close" onclick="toggleCart()">×</button>
        <h2 class="cart-title">Ваша корзина</h2>
        <div id="cartItems"></div>
        <div class="cart-total" id="cartTotal" style="display: none;">
            <div class="total-row">
                <span>Товары:</span>
                <span id="subtotal">0₽</span>
            </div>
            <div class="total-row">
                <span>Доставка:</span>
                <span>500₽</span>
            </div>
            <div class="total-row grand">
                <span>Итого:</span>
                <span id="grandTotal">0₽</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <div class="notification" id="notification"></div>
    <div class="particles"></div>

    <script>
        const products = [
            { id: 1, name: "Quantum Phone X", category: "гаджеты", price: 89990, icon: "📱", badge: "NEW", description: "Смартфон с квантовым процессором" },
            { id: 2, name: "Cyber Headphones", category: "аудио", price: 15990, icon: "🎧", badge: "HIT", description: "Наушники с шумоподавлением" },
            { id: 3, name: "Holo Laptop Pro", category: "компьютеры", price: 149990, icon: "💻", badge: "PRO", description: "Ноутбук с голографическим дисплеем" },
            { id: 4, name: "Smart Watch Ultra", category: "гаджеты", price: 45990, icon: "⌚", badge: "NEW", description: "Умные часы нового поколения" },
            { id: 5, name: "Wireless Charger", category: "аксессуары", price: 4990, icon: "🔋", badge: "", description: "Беспроводная зарядная станция" },
            { id: 6, name: "VR Headset Max", category: "vr", price: 79990, icon: "🥽", badge: "VR", description: "Шлем виртуальной реальности" },
            { id: 7, name: "Gaming Mouse RGB", category: "аксессуары", price: 8990, icon: "🖱️", badge: "", description: "Игровая мышь с RGB подсветкой" },
            { id: 8, name: "Portable Speaker", category: "аудио", price: 12990, icon: "🔊", badge: "HIT", description: "Портативная колонка премиум класса" },
            { id: 9, name: "Tablet Ultra", category: "гаджеты", price: 64990, icon: "📲", badge: "", description: "Планшет с OLED экраном" },
            { id: 10, name: "Mechanical Keyboard", category: "аксессуары", price: 18990, icon: "⌨️", badge: "PRO", description: "Механическая клавиатура" },
            { id: 11, name: "Gaming PC Elite", category: "компьютеры", price: 199990, icon: "🖥️", badge: "TOP", description: "Игровой компьютер топового уровня" },
            { id: 12, name: "Drone Pro 4K", category: "гаджеты", price: 55990, icon: "🚁", badge: "NEW", description: "Профессиональный дрон с 4K камерой" },
            { id: 13, name: "AR Glasses", category: "vr", price: 129990, icon: "👓", badge: "AR", description: "Очки дополненной реальности" },
            { id: 14, name: "Studio Monitors", category: "аудио", price: 34990, icon: "🎵", badge: "", description: "Студийные мониторы" },
            { id: 15, name: "Action Camera", category: "гаджеты", price: 28990, icon: "📷", badge: "", description: "Экшн-камера 5K" },
            { id: 16, name: "RGB Mousepad", category: "аксессуары", price: 3990, icon: "🎨", badge: "", description: "Коврик для мыши с RGB подсветкой" },
            { id: 17, name: "Graphics Card RTX", category: "компьютеры", price: 89990, icon: "🎮", badge: "TOP", description: "Видеокарта нового поколения" },
            { id: 18, name: "TWS Earbuds Pro", category: "аудио", price: 19990, icon: "🎼", badge: "HIT", description: "Беспроводные наушники TWS" },
        ];

        let cart = [];
        let currentFilter = 'all';

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = products.filter(p => {
                const matchCategory = currentFilter === 'all' || p.category === currentFilter;
                const matchSearch = p.name.toLowerCase().includes(searchTerm) || 
                                  p.description.toLowerCase().includes(searchTerm);
                return matchCategory && matchSearch;
            });

            container.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        ${product.icon}
                        ${product.badge ? `<div class="product-badge">${product.badge}</div>` : ''}
                    </div>
                    <div class="product-info">
                        <div class="product-category">${product.category}</div>
                        <div class="product-title">${product.name}</div>
                        <div class="product-description">${product.description}</div>
                        <div class="product-footer">
                            <div class="product-price">${product.price.toLocaleString()}₽</div>
                            <button class="add-to-cart" onclick="addToCart(${product.id})">
                                В корзину
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
            showNotification(`${product.name} добавлен в корзину!`);
        }

        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart">Корзина пуста</div>';
                cartTotal.style.display = 'none';
                return;
            }

            cartTotal.style.display = 'block';

            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-image">${item.icon}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div style="color: #00ffff;">${item.price.toLocaleString()}₽</div>
                        <div class="cart-item-controls">
                            <button class="quantity-btn" onclick="changeQuantity(${item.id}, -1)">−</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');

            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            document.getElementById('subtotal').textContent = subtotal.toLocaleString() + '₽';
            document.getElementById('grandTotal').textContent = (subtotal + 500).toLocaleString() + '₽';
        }

        function changeQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCart();
                }
            }
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('active');
        }

        function checkout() {
            if (cart.length === 0) return;
            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0) + 500;
            alert(`Спасибо за заказ! Сумма: ${total.toLocaleString()}₽\n\nВ реальном магазине здесь была бы форма оформления заказа.`);
            cart = [];
            updateCart();
            toggleCart();
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // Фильтры
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.category;
                renderProducts();
            });
        });

        // Поиск
        document.getElementById('searchInput').addEventListener('input', renderProducts);

        // Кастомный курсор
        const cursor = document.querySelector('.cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Частицы
        const particlesContainer = document.querySelector('.particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 10 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
            particlesContainer.appendChild(particle);
        }

        // Инициализация
        renderProducts();
        updateCart();
    </script>
</body>
</html>
